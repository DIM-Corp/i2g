[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "i2g"
version = "0.2.0"
description = "Convert grayscale images into NetworkX graph structures"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ email = "info@dimcorp237.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=9.0",
    "networkx>=3.0",
]

[project.urls]
Homepage = "https://github.com/DIM-Corp/i2g"
Repository = "https://github.com/DIM-Corp/i2g"
Issues = "https://github.com/DIM-Corp/i2g/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "flake8",
    "black",
    "build",
    "twine",
]

[tool.black]
target-version = ["py310"]
